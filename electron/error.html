<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Error</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: #282c34;
      color: #ffffff;
      text-align: center;
      padding: 50px;
      margin: 0;
    }
    .error-container {
      max-width: 600px;
      margin: 0 auto;
      background-color: rgba(0, 0, 0, 0.3);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #e74c3c;
      margin-bottom: 20px;
    }
    p {
      margin-bottom: 20px;
      font-size: 16px;
      line-height: 1.5;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="icon">⚠️</div>
    <h1>Could Not Connect to Development Server</h1>
    <p>The React development server at http://localhost:3000 could not be reached.</p>
    <p>Make sure you start the React app first by running:</p>
    <code>cd ui && npm start</code>
    <p>Then restart the Electron app:</p>
    <code>cd electron && npm start</code>
  </div>
</body>
</html>
